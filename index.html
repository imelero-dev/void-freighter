<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0c0f" />
  <title>VOID FREIGHTER</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/><path d='M3 11 8 3l5 8-5-2z' fill='%23d9a441'/></svg>" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --amber: #d9a441;
      --amber-dim: rgba(217, 164, 65, 0.45);
      --red: #e8402a;
      --cyan: #7fb1c9;
      --green: #7fc97f;
      --panel: rgba(10, 12, 15, 0.92);
      --border: rgba(217, 164, 65, 0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; overflow: hidden; background: #000;
      font-family: 'Lucida Console', Monaco, monospace;
      user-select: none;
      touch-action: none; overscroll-behavior: none;
    }
    canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    canvas#hud { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; }

    /* ---------- windows ---------- */
    .vf-windows { position: fixed; inset: 0; pointer-events: none; z-index: 20; display: flex; align-items: center; justify-content: center; }
    .vf-window {
      pointer-events: auto; position: absolute; display: flex; flex-direction: column;
      min-width: 380px; max-width: 92vw; max-height: 82vh;
      background: var(--panel); border: 1px solid var(--border);
      box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 60px rgba(217,164,65,0.03);
      color: #cfc4ae;
    }
    .vf-window.wide { min-width: 700px; }
    .vf-titlebar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 12px; border-bottom: 1px solid var(--border);
      background: rgba(217, 164, 65, 0.07);
      color: var(--amber); font-size: 13px; letter-spacing: 2px;
    }
    .vf-close {
      background: none; border: 1px solid var(--border); color: var(--amber);
      cursor: pointer; font-size: 11px; padding: 1px 7px; font-family: inherit;
    }
    .vf-close:hover { background: rgba(217,164,65,0.15); }
    .vf-body { padding: 10px 14px; overflow-y: auto; overflow-x: auto; font-size: 12px; }
    .vf-body::-webkit-scrollbar { width: 8px; }
    .vf-body::-webkit-scrollbar-thumb { background: rgba(217,164,65,0.3); }

    .vf-empty { color: #8a8d90; padding: 18px 6px; font-style: italic; }
    .vf-credits { color: var(--amber); font-size: 15px; margin-bottom: 4px; }
    .vf-subline { color: #9a958a; font-size: 11px; margin-bottom: 8px; }
    .vf-table { display: flex; flex-direction: column; gap: 1px; }
    .vf-row { display: flex; align-items: center; gap: 8px; padding: 3px 4px; }
    .vf-row:nth-child(even) { background: rgba(255,255,255,0.025); }
    .vf-row.vf-header { color: var(--amber-dim); font-size: 10px; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
    .vf-row img { width: 22px; height: 22px; }
    /* market table: a shared grid template keeps header and rows aligned */
    .vf-table.market-grid .vf-row {
      display: grid;
      grid-template-columns: 26px minmax(130px, 1fr) 58px 58px 58px 48px minmax(110px, 150px) auto;
      align-items: center; gap: 6px;
    }
    .vf-table.market-grid .vf-cell { width: auto; min-width: 0; }
    .vf-table.market-grid .vf-cell.num { text-align: right; }
    .vf-table.market-grid .vf-cell.best { text-align: right; }
    .vf-table.market-grid .vf-cell.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vf-table.market-grid .vf-cell.best { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
    .vf-cell { flex: 0 0 auto; }
    .vf-cell.icon { width: 26px; }
    .vf-cell.name { flex: 1 1 auto; color: #d8cfc0; }
    .vf-cell.name.illegal { color: #d07a6a; }
    .vf-cell.name.sealed { color: #b0a268; }
    .vf-cell.name.hostile { color: var(--red); }
    .vf-cell.name.friendly { color: var(--green); }
    .vf-cell.name.unknown { color: #8a8d90; }
    .vf-cell.num { width: 64px; text-align: right; color: #c2b89f; }
    .vf-cell.best { width: 150px; text-align: right; color: #87a5b5; font-size: 10px; }
    .vf-cell.actions { display: flex; gap: 3px; margin-left: 8px; }
    .vf-cell.arrow { color: var(--amber); }

    .vf-btn {
      background: rgba(217,164,65,0.08); border: 1px solid var(--border); color: var(--amber);
      padding: 5px 12px; cursor: pointer; font-family: inherit; font-size: 11px; letter-spacing: 1px;
    }
    .vf-btn:hover:not(:disabled) { background: rgba(217,164,65,0.2); }
    .vf-btn:disabled { opacity: 0.35; cursor: default; }
    .vf-btn.accept { border-color: rgba(127,201,127,0.5); color: var(--green); }
    .vf-btn.accept:hover { background: rgba(127,201,127,0.15); }
    .vf-btn.danger { border-color: rgba(232,64,42,0.5); color: var(--red); }
    .vf-btn.danger:hover { background: rgba(232,64,42,0.15); }
    .vf-btn.undock { border-color: rgba(127,177,201,0.5); color: var(--cyan); margin-left: auto; }
    .vf-btn.active { background: rgba(217,164,65,0.28); box-shadow: inset 0 -2px 0 var(--amber); }
    .vf-btn.big { font-size: 14px; padding: 10px 22px; }
    .vf-mini {
      background: none; border: 1px solid rgba(217,164,65,0.3); color: var(--amber);
      padding: 1px 5px; cursor: pointer; font-family: inherit; font-size: 10px;
    }
    .vf-mini:hover { background: rgba(217,164,65,0.15); }
    .vf-mini.sell { border-color: rgba(127,201,127,0.35); color: var(--green); }
    .vf-mini.sell:hover { background: rgba(127,201,127,0.12); }

    /* dock bar */
    .vf-dockbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 15;
      display: flex; align-items: center; gap: 10px; padding: 9px 16px;
      flex-wrap: wrap; row-gap: 6px;
      background: linear-gradient(rgba(8,10,12,0.95), rgba(8,10,12,0.75));
      border-bottom: 1px solid var(--border);
    }
    .vf-dock-name { color: var(--amber); font-size: 15px; letter-spacing: 1px; }
    .vf-dock-sub { color: #8a8d90; font-size: 11px; margin-right: 12px; }

    /* contracts */
    .vf-contract { border: 1px solid rgba(217,164,65,0.2); padding: 8px 10px; margin-bottom: 8px; }
    .vf-ctype { font-size: 9px; letter-spacing: 1px; padding: 2px 6px; border: 1px solid; margin-right: 8px; }
    .vf-ctype.transport { color: var(--cyan); }
    .vf-ctype.urgent { color: var(--red); }
    .vf-ctype.supply { color: var(--green); }
    .vf-ctype.bounty { color: var(--amber); }
    .vf-cdesc { color: #d8cfc0; }
    .vf-cdetail { color: #9a958a; font-size: 11px; margin: 6px 0; }
    .vf-cdetail .urgent { color: var(--red); }
    .vf-locked { color: #8a8d90; font-size: 11px; font-style: italic; }

    /* shipyard */
    .vf-tabs { display: flex; gap: 2px; margin: 8px 0 12px; border-bottom: 1px solid var(--border); }
    .vf-tab {
      background: rgba(217,164,65,0.05); border: 1px solid rgba(217,164,65,0.25); border-bottom: none;
      color: var(--amber-dim); padding: 6px 18px; cursor: pointer; font-family: inherit;
      font-size: 11px; letter-spacing: 2px;
    }
    .vf-tab:hover { background: rgba(217,164,65,0.12); }
    .vf-tab.active { background: rgba(217,164,65,0.18); color: var(--amber); border-color: var(--amber); }
    .vf-ws-status { color: #9a958a; font-size: 12px; margin-bottom: 8px; }
    .vf-ws-status.active { color: var(--green); }
    .vf-tier.craftable { border-color: rgba(127,201,127,0.6); color: var(--green); }
    .vf-services { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
    .vf-section { margin-top: 12px; }
    .vf-section-title { color: var(--amber-dim); letter-spacing: 2px; font-size: 11px; margin-bottom: 6px; }
    .vf-hull-row {
      display: grid; grid-template-columns: 210px 1fr auto;
      gap: 2px 10px; align-items: center; padding: 5px 4px;
    }
    .vf-hull-row:nth-child(even) { background: rgba(255,255,255,0.025); }
    .vf-hull-row > :last-child { grid-row: 1 / 3; grid-column: 3; align-self: center; }
    .vf-hull-name { color: var(--amber); }
    .vf-hull-desc { color: #8a8d90; font-size: 10px; }
    .vf-hull-stats { color: #9aa5ad; font-size: 10px; grid-column: 1 / 3; }
    .vf-owned { color: var(--green); font-size: 11px; letter-spacing: 1px; }
    .vf-mod-row { display: flex; align-items: center; gap: 8px; padding: 4px; }
    .vf-mod-row:nth-child(even) { background: rgba(255,255,255,0.025); }
    .vf-mod-icon { width: 22px; height: 22px; }
    .vf-mod-name { width: 210px; color: #d8cfc0; }
    .vf-mod-tiers { display: flex; gap: 4px; flex-wrap: wrap; }
    .vf-tier {
      background: none; border: 1px solid rgba(217,164,65,0.3); color: var(--amber);
      padding: 2px 6px; cursor: pointer; font-family: inherit; font-size: 10px;
    }
    .vf-tier:hover { background: rgba(217,164,65,0.15); }
    .vf-tier.current { border-color: var(--green); color: var(--green); cursor: default; }
    .vf-tier.sell { border-color: rgba(232,64,42,0.4); color: #d07a6a; }
    .vf-stats { color: #87918f; font-size: 10px; margin-top: 10px; line-height: 1.7; }
    .vf-news { margin-top: 12px; border-top: 1px solid rgba(217,164,65,0.2); padding-top: 6px; }
    .vf-news-title { color: var(--amber-dim); font-size: 10px; letter-spacing: 2px; }
    .vf-news-line { color: #87a5b5; font-size: 11px; margin-top: 4px; }

    /* map */
    .vf-map-flex { display: flex; gap: 10px; align-items: stretch; }
    .vf-map-side {
      width: 218px; flex: 0 0 auto; max-height: 560px; overflow-y: auto;
      border: 1px solid rgba(217,164,65,0.2); padding: 6px 8px;
      background: rgba(217,164,65,0.03);
    }
    .vf-map-side::-webkit-scrollbar { width: 6px; }
    .vf-map-side::-webkit-scrollbar-thumb { background: rgba(217,164,65,0.3); }
    .vf-map-side-title { color: var(--amber-dim); font-size: 10px; letter-spacing: 2px; margin-bottom: 6px; }
    .vf-map-st { padding: 6px 4px; border-bottom: 1px solid rgba(217,164,65,0.12); }
    .vf-map-st.unknown { opacity: 0.75; }
    .vf-map-st-name { color: var(--cyan); font-size: 12px; cursor: pointer; }
    .vf-map-st-name:hover { text-decoration: underline; }
    .vf-map-st-name.black { color: #d07a6a; }
    .vf-map-st-dist { color: #8a8d90; font-size: 10px; margin: 2px 0; }
    .vf-map-st-svc { color: #b0a89a; font-size: 9px; letter-spacing: 0.5px; }
    .vf-map-canvaswrap { flex: 1 1 auto; min-width: 0; }
    .vf-map-canvas { width: 100%; image-rendering: pixelated; cursor: crosshair; background: #05070a; }
    .vf-map-bar { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .vf-map-info { flex: 1; color: #c2b89f; font-size: 11px; }

    /* chat */
    .vf-chat { position: fixed; left: 16px; top: 56px; z-index: 8; pointer-events: none; max-width: 440px; }
    .vf-chat-list { display: flex; flex-direction: column; gap: 2px; }
    .vf-chat-line { color: #b8c4c0; font-size: 12px; text-shadow: 0 0 4px #000; transition: opacity 2.5s; }
    .vf-chat-line.station { color: #9db8c9; }
    .vf-chat-line.system { color: var(--amber-dim); }
    .vf-chat-line.radio { color: #8fb89a; font-style: italic; }
    .vf-chat-line.faded { opacity: 0; }
    /* chat open: full history becomes readable + scrollable */
    .vf-chat.open { pointer-events: auto; }
    .vf-chat.open .vf-chat-list {
      max-height: 42vh; overflow-y: auto; padding: 8px;
      background: rgba(8, 10, 12, 0.85); border: 1px solid rgba(217,164,65,0.25);
    }
    .vf-chat.open .vf-chat-list::-webkit-scrollbar { width: 6px; }
    .vf-chat.open .vf-chat-list::-webkit-scrollbar-thumb { background: rgba(217,164,65,0.3); }
    .vf-chat.open .vf-chat-line.faded { opacity: 1; }
    .vf-chat-inputwrap { pointer-events: auto; margin-top: 6px; }
    .vf-chat-input {
      width: 380px; background: rgba(8,10,12,0.9); border: 1px solid var(--border);
      color: #d8cfc0; padding: 6px 10px; font-family: inherit; font-size: 12px; outline: none;
    }

    /* credits HUD chip */
    .vf-credits-hud {
      position: fixed; top: 12px; right: 16px; z-index: 6;
      color: var(--amber); font-size: 13px; text-shadow: 0 0 6px #000;
      pointer-events: none;
    }

    /* menu */
    .vf-menu {
      position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(8,10,14,0.88), rgba(0,0,0,0.97));
    }
    .vf-menu-box { text-align: center; max-width: 420px; width: 90vw; }
    .vf-menu-title {
      color: var(--amber); font-size: 42px; letter-spacing: 12px; margin-bottom: 4px;
      text-shadow: 0 0 24px rgba(217,164,65,0.4);
    }
    .vf-menu-sub { color: #8a8d90; letter-spacing: 4px; font-size: 12px; margin-bottom: 30px; }
    .vf-menu-section { border: 1px solid rgba(217,164,65,0.2); padding: 14px; margin-bottom: 14px; }
    .vf-menu-h { color: var(--amber-dim); font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; }
    .vf-menu-row { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
    .vf-input {
      width: 100%; background: rgba(8,10,12,0.9); border: 1px solid var(--border);
      color: #d8cfc0; padding: 8px 10px; font-family: inherit; font-size: 13px;
      outline: none; margin-bottom: 8px; text-align: center;
    }
    .vf-menu-status { color: var(--red); min-height: 20px; font-size: 12px; margin: 8px 0; }
    .vf-menu-foot { color: #5a5d60; font-size: 10px; margin-top: 18px; }
    .vf-resume { display: block; width: 100%; margin-bottom: 18px; }
    .vf-derelict-story {
      color: #b8c4be; font-size: 12px; font-style: italic; line-height: 1.8;
      padding: 12px 6px; max-width: 440px; white-space: pre-wrap;
    }
    .vf-set-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
    .vf-set-label { color: #b0a89a; font-size: 11px; width: 130px; text-align: left; }
    .vf-set-value { color: var(--amber); font-size: 11px; width: 44px; text-align: right; }
    .vf-slider { flex: 1; accent-color: #d9a441; height: 4px; }

    /* help */
    .vf-help {
      position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85);
    }
    .vf-help-box {
      background: var(--panel); border: 1px solid var(--border); padding: 22px 30px;
      max-height: 86vh; overflow-y: auto; color: #cfc4ae;
    }
    .vf-help-grid { display: grid; grid-template-columns: 110px 1fr; gap: 4px 16px; margin: 12px 0; font-size: 12px; }
    .vf-key { color: var(--amber); }
    .vf-desc { color: #b0a89a; }
    .vf-help-tip { max-width: 460px; color: #8a8d90; font-size: 11px; font-style: italic; margin: 12px 0; line-height: 1.6; }

    .vf-row.refine img { width: 22px; height: 22px; }
    .vf-row.contact { gap: 12px; }

    /* keybinds */
    .vf-binds {
      display: grid; grid-template-columns: 1fr 140px auto;
      gap: 3px 12px; align-items: center; margin: 8px 0 12px; font-size: 11px;
    }
    .vf-bind-label { color: #b0a89a; }
    .vf-bind-key { color: var(--amber); letter-spacing: 1px; }
    .vf-bind-actions { display: flex; gap: 4px; }

    /* shopkeeper card */
    .vf-keeper {
      display: flex; gap: 12px; align-items: center;
      border: 1px solid rgba(217,164,65,0.25); background: rgba(217,164,65,0.04);
      padding: 8px 10px; margin-bottom: 10px;
    }
    .vf-keeper-img {
      width: 64px; height: 64px; image-rendering: pixelated;
      border: 1px solid var(--border); flex: 0 0 auto;
    }
    .vf-keeper-name { color: var(--amber); font-size: 13px; letter-spacing: 1px; }
    .vf-keeper-role { color: #8a8d90; font-size: 10px; margin: 2px 0 4px; }
    .vf-keeper-line { color: #b0a89a; font-size: 11px; font-style: italic; }

    .vf-act-label { color: var(--amber-dim); font-size: 9px; letter-spacing: 1px; margin: 0 2px 0 6px; }
    .vf-act-label.sell { color: rgba(127,201,127,0.6); }
    .vf-mini:disabled { opacity: 0.3; cursor: default; }

    /* ---------- touch controls overlay (mobile only, built by touch.ts) ---------- */
    #vf-touch {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      -webkit-user-select: none; user-select: none;
    }
    #vf-touch .vf-touch-btn {
      pointer-events: auto; touch-action: none;
      min-width: 44px; min-height: 44px; padding: 4px 8px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10, 12, 15, 0.75); border: 1px solid rgba(217, 164, 65, 0.35);
      color: var(--amber); font-family: inherit; font-size: 10px; letter-spacing: 1px;
    }
    #vf-touch .vf-touch-btn.held { background: rgba(217, 164, 65, 0.45); color: #0a0c0f; }
    /* collapsed NAV/SYS menus, tucked into the top-left corner */
    .vf-touch-menus {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 8px);
      left: calc(env(safe-area-inset-left, 0px) + 8px);
      display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    }
    .vf-touch-menu { position: relative; pointer-events: none; }
    #vf-touch .vf-touch-menubtn {
      pointer-events: auto; touch-action: none;
      width: 52px; height: 30px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10, 12, 15, 0.80); border: 1px solid rgba(217, 164, 65, 0.45);
      color: var(--amber); font-family: inherit; font-size: 10px; letter-spacing: 1px;
    }
    .vf-touch-popover {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 18;
      background: rgba(10, 12, 15, 0.92); border: 1px solid rgba(217, 164, 65, 0.35);
      padding: 6px; gap: 6px;
    }
    .vf-touch-popover.open { display: flex; }
    /* roll holds pinned to the bottom corners (held through maneuvers) */
    #vf-touch .vf-touch-roll-l {
      position: absolute; left: calc(10px + env(safe-area-inset-left, 0px));
      bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 48px;
    }
    #vf-touch .vf-touch-roll-r {
      position: absolute; right: calc(10px + env(safe-area-inset-right, 0px));
      bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 48px;
    }
    .vf-rotate-hint {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 100; display: none; padding: 10px 18px; text-align: center;
      background: rgba(10, 12, 15, 0.85); border: 1px solid var(--border);
      color: var(--amber); font-size: 12px; letter-spacing: 1px; pointer-events: none;
    }
    .vf-touch-look {
      position: absolute; left: 0; top: 64px; bottom: 72px; width: 40vw;
      pointer-events: auto; touch-action: none;
    }
    .vf-touch-stickbase {
      position: absolute; width: 130px; height: 130px; border-radius: 50%;
      border: 1px solid rgba(217, 164, 65, 0.35); background: rgba(217, 164, 65, 0.04);
      transform: translate(-50%, -50%); pointer-events: none; display: none;
    }
    .vf-touch-nub {
      position: absolute; width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid var(--amber); background: rgba(217, 164, 65, 0.3);
      box-shadow: 0 0 12px rgba(217, 164, 65, 0.35);
      transform: translate(-50%, -50%); pointer-events: none; display: none;
    }
    .vf-touch-throttle {
      position: absolute; right: calc(118px + env(safe-area-inset-right, 0px));
      top: 28%; height: 42%; width: 54px;
      border: 1px solid rgba(217, 164, 65, 0.35); background: rgba(10, 12, 15, 0.6);
      pointer-events: auto; touch-action: none;
    }
    /* spring-loaded BOOST band at the very top of the throttle */
    .vf-touch-throttle::before {
      content: 'BOOST'; position: absolute; left: 0; right: 0; top: 0; height: 7%;
      font-size: 7px; letter-spacing: 1px; text-align: center; line-height: 1.6;
      color: rgba(255, 136, 48, 0.7); background: rgba(255, 136, 48, 0.12);
      border-bottom: 1px dashed rgba(255, 136, 48, 0.4); pointer-events: none;
    }
    .vf-touch-throttle.boosting { border-color: rgba(255, 136, 48, 0.9); }
    .vf-touch-throttle.boosting::before { color: #ff8830; background: rgba(255, 136, 48, 0.35); }
    .vf-touch-throttle.boosting .vf-touch-throttle-fill {
      background: linear-gradient(rgba(255, 136, 48, 0.7), rgba(255, 136, 48, 0.4));
    }
    .vf-touch-throttle-fill {
      position: absolute; left: 2px; right: 2px; bottom: 2px; height: 0%;
      background: linear-gradient(rgba(217, 164, 65, 0.55), rgba(217, 164, 65, 0.3));
      pointer-events: none;
    }
    .vf-touch-throttle-label {
      position: absolute; top: -16px; left: 0; right: 0; text-align: center;
      color: var(--amber-dim); font-size: 9px; letter-spacing: 2px;
    }
    #vf-touch .vf-touch-fire {
      position: absolute; right: calc(14px + env(safe-area-inset-right, 0px)); top: 26%;
      width: 90px; height: 90px; border-radius: 50%; font-size: 12px;
    }
    #vf-touch .vf-touch-secondary {
      position: absolute; right: calc(20px + env(safe-area-inset-right, 0px)); top: calc(26% + 104px);
      width: 76px; height: 76px; border-radius: 50%; font-size: 9px;
    }
    /* portrait phones: the flight layout needs landscape — the rotate hint
       takes over, the overlay would only get in the way */
    @media (orientation: portrait) and (max-width: 480px) {
      #vf-touch { display: none; }
    }

    /* ---------- small screens: narrow portrait OR phone landscape ---------- */
    @media (max-width: 480px), (max-height: 480px) and (orientation: landscape) {
      .vf-window { min-width: 0; width: 96vw; max-height: 75vh; }
      .vf-window.wide { min-width: 0; width: 96vw; }
      .vf-body { font-size: 11px; }
      .vf-table { font-size: 10px; }
      .vf-cell.num { width: 48px; }
      /* market: drop the "best elsewhere" column, scroll if it still spills */
      .vf-table.market-grid { overflow-x: auto; }
      .vf-table.market-grid .vf-cell.best { display: none; }
      .vf-table.market-grid .vf-row {
        grid-template-columns: 22px minmax(80px, 1fr) 42px 42px 42px 34px auto;
        gap: 3px; font-size: 10px;
      }
      /* hulls: name/desc/stats stack in one column, buy button at the right */
      .vf-hull-row { grid-template-columns: 1fr auto; }
      .vf-hull-row > :last-child { grid-row: 1 / 3; grid-column: 2; }
      .vf-hull-stats { grid-column: 1; }
      .vf-mod-name { width: 130px; }
      /* map: registry as a strip above a full-width canvas */
      .vf-map-flex { flex-direction: column; }
      .vf-map-side { width: 100%; max-height: 120px; }
      .vf-help-box { padding: 12px 16px; }
      .vf-help-grid { grid-template-columns: 90px 1fr; font-size: 11px; }
      .vf-menu-title { font-size: 28px; letter-spacing: 6px; }
      .vf-chat { top: 8px; left: 68px; max-width: 280px; } /* clear of NAV/SYS */
      .vf-credits-hud { top: 6px; right: 8px; font-size: 11px; }
      .vf-dockbar {
        padding: 5px calc(8px + env(safe-area-inset-right, 0px)) 5px calc(8px + env(safe-area-inset-left, 0px));
        gap: 6px;
      }
    }
    /* phone landscape only: shorter windows, chat clear of the stick zone */
    @media (max-height: 480px) and (orientation: landscape) {
      .vf-window { max-height: 68vh; }
      .vf-chat { top: 50px; left: 44%; max-width: 54vw; }
      /* the chart needs the room: shrink the registry strip */
      .vf-map-side { max-height: 84px; }
    }
  </style>
