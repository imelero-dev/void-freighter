# Void Freighter — voidfreighter.imelero.dev
# Instalar: sudo ln -sf /home/ivan/void_freighter/deploy/nginx-voidfreighter.conf /etc/nginx/sites-enabled/voidfreighter
# Verificar: sudo nginx -t && sudo systemctl reload nginx
# TLS: certbot --nginx -d voidfreighter.imelero.dev (añade el bloque 443 y la redirección)

server {
    server_name voidfreighter.imelero.dev;

    # todo (estáticos, /api y WebSocket del mundo) va al server del juego
    location / {
        proxy_pass         http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # el WS del mundo manda snapshots a 10 Hz — nunca debería estar
        # callado, pero damos margen de sobra antes de cortar
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/voidfreighter.imelero.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/voidfreighter.imelero.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = voidfreighter.imelero.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name voidfreighter.imelero.dev;
    return 404; # managed by Certbot


}